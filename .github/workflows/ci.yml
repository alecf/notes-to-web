name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build
        run: swift build

      # The live-store suite is skipped here: CI has no Notes library and no
      # Full Disk Access. Run it locally with NOTES_TO_WEB_LIVE=1.
      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: make app
